<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>แบบสอบถาม</title>
</head>

<body>

    <h3 style="text-align: center;">แบบสอบถาม</h3>
    <hr>

    <form>
        <table align="center" cellpadding="5"
               style="background-color: darksalmon;">

            <tr>
                <td colspan="2">
                    <b>ข้อมูลผู้ตอบแบบสอบถาม</b>
                </td>
            </tr>

            <tr>
                <td><b>ชื่อ-นามสกุล</b></td>
                <td>
                    <input type="text" name="fullname">
                </td>
            </tr>

            <tr>
                <td><b>รหัสนักศึกษา</b></td>
                <td>
                    <input type="text" name="student_id">
                </td>
            </tr>

            <tr>
                <td><b>เพศ</b></td>
                <td>
                    <input type="radio" name="gender" value="ชาย" checked> ชาย
                    <input type="radio" name="gender" value="หญิง"> หญิง
                </td>
            </tr>

            <tr>
                <td><b>สังกัดคณะ</b></td>
                <td>
                    <select name="faculty" size="10">
                        <option>วิทยาศาสตร์</option>
                        <option>วิทยาการคอมพิวเตอร์</option>
                        <option>ครุศาสตร์</option>
                        <option>บริหารธุรกิจและการจัดการ</option>
                        <option>มนุษยศาสตร์</option>
                        <option>เทคโนโลยีอุตสาหกรรม</option>
                        <option>เกษตรศาสตร์</option>
                        <option>พยาบาลศาสตร์</option>
                        <option>สาธารณสุขศาสตร์</option>
                        <option>แพทย์แผนไทยและทางเลือก</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2"><b>แบบสีที่ชื่นชอบ</b></td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="checkbox" name="color" value="สีแดง"> สีแดง
                    <input type="checkbox" name="color" value="สีเขียว"> สีเขียว
                    <input type="checkbox" name="color" value="สีน้ำเงิน"> สีน้ำเงิน
                </td>
            </tr>

            <tr>
                <td colspan="2"><b>ผลไม้ที่ชื่นชอบ</b></td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="checkbox" name="fruit" value="มะม่วง"> มะม่วง
                    <input type="checkbox" name="fruit" value="น้อยหน่า"> น้อยหน่า
                    <input type="checkbox" name="fruit" value="ทุเรียน"> ทุเรียน
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="checkbox" name="fruit" value="ลำไย"> ลำไย
                    <input type="checkbox" name="fruit" value="ฝรั่ง"> ฝรั่ง
                    <input type="checkbox" name="fruit" value="แตงโม"> แตงโม
                </td>
            </tr>

            <tr>
                <td colspan="2"><b>อาหารที่ชื่นชอบ</b></td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="checkbox" name="food" value="ต้มยำกุ้ง"> ต้มยำกุ้ง
                    <input type="checkbox" name="food" value="ไข่เจียวหมูสับ"> ไข่เจียวหมูสับ
                    <input type="checkbox" name="food" value="แกงข่าไก่"> แกงข่าไก่
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="checkbox" name="food" value="แกงเขียวหวานไก่"> แกงเขียวหวานไก่
                    <input type="checkbox" name="food" value="ผัดไทย"> ผัดไทย
                    <input type="checkbox" name="food" value="ราดหน้าหมูกรอบ"> ราดหน้าหมูกรอบ
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="บันทึก">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
